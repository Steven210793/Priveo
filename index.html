<style>

x}.nav button.active{color:#75b8ff}.auth{min-height:90dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:440px;margin:auto}.auth .card{width:100%}.toast{position:fixed;bottom:88px;left:15px;right:15px;background:#325376;color:white;padding:13px;border-radius:12px;z-index:20;max-width:500px;margin:auto}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}.empty{text-align:center;color:#a7b7ce;padding:28px 8px}.breadcrumb{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.breadcrumb button{background:transparent;border:0;color:#9cd0ff;padding:4px}.search{position:sticky;top:0;z-index:2}.note{border-left:3px solid #75b8ff;padding-left:12px;color:#b9c9dd}.modalbg{position:fixed;inset:0;background:#050b15d9;display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}.modal{width:min(100%,520px);max-height:90dvh;overflow:auto;background:#172a44;border:1px solid #45617e;border-radius:20px;padding:20px}.modal h2{margin-top:0}.space{height:8px}.fileinput{display:none}@media(min-width:650px){#app{padding-left:30px;padding-right:30px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main id="app"></main><script>
'use strict';
const $=s=>document.querySelector(s), encoder=new TextEncoder(),decoder=new TextDecoder();
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID(), today=()=>new Date().toISOString().slice(0,10), datefmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('fr-FR'):'—';
const bytesToB64=b=>{let chunks=[];for(let i=0;i<b.length;i+=8192)chunks.push(String.fromCharCode(...b.subarray(i,i+8192)));return btoa(chunks.join(''))};
const b64ToBytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const daydiff=s=>Math.ceil((new Date(s+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
let db,secret=null,key=null,store=null,tab='home',folder=null,filter='',lockAfter=1,lastInput=Date.now(),previewURL=null;
const empty=()=>({folders:[],files:[],subscriptions:[],settings:{lockAfter:1}});
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('priveo-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getVault(){return new Promise((res,rej)=>{let r=db.transaction('vault').objectStore('vault').get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function setVault(v){return new Promise((res,rej)=>{let r=db.transaction('vault','readwrite').objectStore('vault').put(v,'main');r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function derive(pass,salt){const material=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(v,k){let iv=crypto.getRandomValues(new Uint8Array(12));let payload=encoder.encode(JSON.stringify(v));let cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,payload);return {iv:bytesToB64(iv),data:bytesToB64(new Uint8Array(cipher))}}
async function decrypt(v,k){let plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(v.iv)},k,b64ToBytes(v.data));return JSON.parse(decoder.decode(plain))}
async function save(){if(!key)return;secret.box=await encrypt(store,key);await setVault(secret)}
function lock(){key=null;store=null;folder=null;filter='';if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null;render()}
function toast(s){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3500)}
function modal(title,content){document.querySelector('.modalbg')?.remove();let e=document.createElement('div');e.className='modalbg';e.innerHTML='<section class="modal" role="dialog" aria-modal="true"><div class="toolbar" style="justify-content:space-between"><h2>'+escapeHTML(title)+'</h2><button class="btn ghost sm" data-close>Fermer ✕</button></div>'+content+'</section>';e.addEventListener('click',ev=>{if(ev.target===e||ev.target.closest('[data-close]'))e.remove()});document.body.append(e);return e}
function input(label,name,value='',type='text',required=true){return '<label>'+escapeHTML(label)+'</label><input class="field" name="'+name+'" type="'+type+'" value="'+escapeHTML(value)+'" '+(required?'required':'')+'>'}
function navigate(t){tab=t;folder=null;filter='';render()}
const foldersFor=parent=>store.folders.filter(x=>x.parent===parent);
const allChildren=(fid)=>{let s=new Set([fid]);for(let changed=true;changed;){changed=false;for(let f of store.folders)if(s.has(f.parent)&&!s.has(f.id)){s.add(f.id);changed=true}}return s};
function safeName(x){return escapeHTML(x||'Sans nom')}
function row(symbol,name,desc,actions,open){return '<div class="item"><span class="symbol">'+symbol+'</span><div class="main" '+(open?'data-open="'+open+'"':'')+'><strong>'+safeName(name)+'</strong><div class="sub">'+escapeHTML(desc||'')+'</div></div><div class="actions">'+actions+'</div></div>'}
const act=(label,action,value,style='ghost')=>'<button class="btn sm '+style+'" data-action="'+action+'" data-id="'+value+'">'+label+'</button>';
function header(){return '<header><div class="brand"><img src="./icon.svg" alt=""><div><h1>Priveo</h1><div class="muted small">Mon espace privé</div></div></div><button class="btn ghost sm" data-action="lock">🔒 Verrouiller</button></header>'}
function nav(){return '<nav class="nav">'+[['home','⌂','Accueil'],['files','▣','Dossiers'],['subscriptions','◷','Échéances'],['settings','⚙','Réglages']].map(a=>'<button class="'+(tab===a[0]?'active':'')+'" data-tab="'+a[0]+'"><span style="font-size:23px">'+a[1]+'</span>'+a[2]+'</button>').join('')+'</nav>'}
function dashboard(){let exp=[...store.files.filter(x=>x.expiry).map(x=>({title:x.name,date:x.expiry,kind:'Document'})),...store.subscriptions.map(x=>({title:x.name,date:x.next,kind:'Abonnement'}))].filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));let m=store.subscriptions.reduce((a,x)=>a+Number(x.price||0)/({monthly:1,quarterly:3,yearly:12}[x.frequency]||1),0);return '<h2>Vue d’ensemble</h2><div class="grid"><div class="card"><div class="muted small">Documents</div><div class="metric">'+store.files.filter(x=>!x.deletedAt).length+'</div></div><div class="card"><div class="muted small">Échéances sous 30 jours</div><div class="metric">'+exp.filter(x=>daydiff(x.date)<=30).length+'</div></div><div class="card"><div class="muted small">Abonnements / mois</div><div class="metric">'+m.toLocaleString('fr-FR',{style:'currency',currency:'EUR'})+'</div></div></div><div class="toolbar"><button class="btn" data-action="upload">＋ Document</button><button class="btn ghost" data-action="create-folder">＋ Dossier</button><button class="btn ghost" data-tab="subscriptions">＋ Échéance</button></div><h2>Prochaines échéances</h2>'+(exp.length?exp.slice(0,6).map(x=>row('◷',x.title,x.kind+' • '+datefmt(x.date),'<span class="pill">'+(daydiff(x.date)<0?'En retard':daydiff(x.date)+' j')+'</span>')).join(''):'<div class="empty">Aucune échéance enregistrée.</div>')+'<h2>Derniers documents</h2>'+([...store.files].filter(x=>!x.deletedAt).sort((a,b)=>b.created.localeCompare(a.created)).slice(0,4).map(x=>row('▤',x.name,datefmt(x.created.slice(0,10)),act('Voir','view',x.id))).join('')||'<div class="empty">Ajoute ton premier document.</div>')}
function filesPage(){let crumbs=[],cur=folder;while(cur){let f=store.folders.find(x=>x.id===cur);if(!f)break;crumbs.unshift(f);cur=f.parent}let folders=foldersFor(folder),files=store.files.filter(x=>x.folder===folder&&!x.deletedAt);if(filter){let q=filter.toLowerCase();folders=store.folders.filter(x=>!x.deletedAt&&x.name.toLowerCase().includes(q));files=store.files.filter(x=>!x.deletedAt&&[x.name,x.notes,x.tags,x.expiry].some(t=>String(t||'').toLowerCase().includes(q)))}return '<div class="breadcrumb"><button data-action="root">Tous les dossiers</button>'+crumbs.map(x=>'› <button data-action="go-folder" data-id="'+x.id+'">'+safeName(x.name)+'</button>').join('')+'</div><input id="search" class="field search" placeholder="Rechercher un document, une étiquette..." value="'+escapeHTML(filter)+'"><div class="toolbar"><button class="btn" data-action="create-folder">＋ Dossier</button><button class="btn ghost" data-action="upload">＋ Fichier / Scanner</button><button class="btn ghost" data-action="template">Modèles</button></div><h2>Dossiers</h2>'+(folders.length?folders.map(x=>row('📁',x.name,'Dossier',act('Ouvrir','go-folder',x.id)+act('⋯','folder-menu',x.id))).join(''):'<div class="empty">Aucun dossier ici.</div>')+'<h2>Documents</h2>'+(files.length?files.map(x=>row('▤',x.name,[x.mime||'',x.expiry?'Expire le '+datefmt(x.expiry):'',x.tags||''].filter(Boolean).join(' · '),act('Voir','view',x.id)+act('Renommer','rename-file',x.id)+act('Déplacer','move-file',x.id)+act('Infos','info-file',x.id)+act('Supprimer','delete-file',x.id,'warn'))).join(''):'<div class="empty">Aucun document ici.</div>')}
function subscriptions(){let subs=[...store.subscriptions].sort((a,b)=>a.next.localeCompare(b.next));return '<h2>Abonnements et échéances</h2><div class="toolbar"><button class="btn" data-action="subscription-add">＋ Abonnement</button></div>'+(subs.length?subs.map(x=>row('◷',x.name,datefmt(x.next)+' · '+Number(x.price||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})+' · '+({monthly:'Mensuel',quarterly:'Trimestriel',yearly:'Annuel'}[x.frequency]||'Ponctuel'),act('Renouveler','renew',x.id)+act('Modifier','subscription-edit',x.id)+act('Suppr.','subscription-delete',x.id,'warn'))).join(''):'<div class="empty">Ajoute ton premier abonnement.</div>')+'<div class="card note small">Les alertes sont vérifiées à l’ouverture de l’application. Elles ne remplacent pas une notification Android en arrière-plan.</div>'}
function settingsPage(){return '<h2>Réglages et sécurité</h2><div class="card"><h3>Verrouillage automatique</h3><label>Après inactivité</label><select id="lockdelay" class="field">'+[[0,'Immédiat (au retour)'],[1,'1 minute'],[5,'5 minutes'],[10,'10 minutes']].map(x=>'<option value="'+x[0]+'" '+(Number(store.settings.lockAfter)===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select><div class="muted small">L’accès se fait actuellement avec le mot de passe du coffre. Déverrouillage biométrique à intégrer et tester.</div></div><div class="card"><h3>Sauvegarde chiffrée</h3><p class="small muted">Enregistre une copie chiffrée de tous tes fichiers et données. Conserve le mot de passe dans un endroit sûr.</p><div class="toolbar"><button class="btn" data-action="backup">Exporter</button><button class="btn ghost" data-action="restore">Restaurer</button></div></div><div class="card"><h3>Corbeille (30 jours)</h3><button class="btn ghost" data-action="trash">Ouvrir la corbeille</button></div><div class="card"><h3>Confidentialité</h3><p class="small muted">Données chiffrées dans le stockage local de ce navigateur, sans transmission à GitHub. Désinstaller l’application ou effacer les données du navigateur peut supprimer le coffre : sauvegarde recommandée.</p></div>'}
function render(){let app=$('#app');if(!key){app.innerHTML='<div class="auth"><img src="./icon.svg" width="100" height="100" alt="Logo Priveo"><h1>Priveo</h1><p class="muted">Tes documents. Ton espace privé.</p><form id="authform" class="card"><h2>'+(secret?'Déverrouiller mon coffre':'Créer mon coffre')+'</h2><label>Mot de passe'+(secret?'':' (12 caractères minimum)')+'</label><input type="password" name="password" autocomplete="'+(secret?'current-password':'new-password')+'" class="field" minlength="'+(secret?1:12)+'" required><button class="btn" type="submit">'+(secret?'Déverrouiller':'Créer un coffre chiffré')+'</button><p class="muted small">Les données restent sur ce téléphone. La biométrie n’est pas encore activée dans cette version. Un mot de passe perdu ne peut pas être récupéré.</p></form></div>';return}
app.innerHTML=header()+(tab==='home'?dashboard():tab==='files'?filesPage():tab==='subscriptions'?subscriptions():settingsPage())+nav()}
async function auth(pass){try{if(!secret){let salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pass,salt);store=empty();secret={version:1,salt:bytesToB64(salt)};await save()}else{key=await derive(pass,b64ToBytes(secret.salt));store=await decrypt(secret.box,key)}lockAfter=Number(store.settings.lockAfter??1);lastInput=Date.now();render();toast('Coffre déverrouillé')}catch(e){key=null;store=null;toast('Mot de passe incorrect ou coffre illisible')}}
function ask(label,initial=''){return prompt(label,initial)}
async function change(action,identifier){if(action==='lock'){lock();return}if(action==='root'){folder=null;filter='';render();return}if(action==='go-folder'){folder=identifier;filter='';render();return}if(action==='create-folder'){let name=ask('Nom du dossier');if(!name?.trim())return;store.folders.push({id:id(),name:name.trim(),parent:folder,created:today()})}
else if(action==='folder-menu'){let f=store.folders.find(x=>x.id===identifier),option=ask('Dossier : 1 Renommer, 2 Déplacer à la racine, 3 Supprimer (avec son contenu)','1');if(option==='1'){let n=ask('Nouveau nom',f.name);if(n?.trim())f.name=n.trim()}if(option==='2')f.parent=null;if(option==='3'&&confirm('Supprimer ce dossier et tous ses sous-dossiers et fichiers ?')){let ids=allChildren(f.id);store.folders=store.folders.filter(x=>!ids.has(x.id));store.files.forEach(x=>{if(ids.has(x.folder))x.deletedAt=today()});folder=null}}
else if(action==='file-menu'){let f=store.files.find(x=>x.id===identifier),option=ask('Document : 1 Renommer, 2 Notes et étiquettes, 3 Date d’expiration, 4 Déplacer, 5 Corbeille','1');if(option==='1'){let n=ask('Nouveau nom',f.name);if(n?.trim())f.name=n.trim()}if(option==='2'){let n=ask('Notes',f.notes||'');if(n!==null)f.notes=n;let t=ask('Étiquettes séparées par des virgules',f.tags||'');if(t!==null)f.tags=t}if(option==='3'){let d=ask('Date d’expiration (AAAA-MM-JJ)',f.expiry||'');if(d!==null&&(!d||/^\d{4}-\d{2}-\d{2}$/.test(d)))f.expiry=d}if(option==='4'){let n=ask('Nom exact du dossier de destination (vide = racine)','');if(n!==null){let dest=store.folders.find(x=>x.name===n);if(!n||dest)f.folder=dest?.id??null;else toast('Dossier introuvable')}}if(option==='5'&&confirm('Mettre dans la corbeille ?'))f.deletedAt=today()}
else if(action==='view'){let f=store.files.find(x=>x.id===identifier);if(previewURL)URL.revokeObjectURL(previewURL);let blob=new Blob([b64ToBytes(f.data)],{type:f.mime||'application/octet-stream'});previewURL=URL.createObjectURL(blob);let kind=f.mime.startsWith('image/')?'image':f.mime==='application/pdf'?'pdf':'other';let content=kind==='image'?'<img style="width:100%;max-height:55dvh;object-fit:contain" src="'+previewURL+'">':kind==='pdf'?'<iframe style="width:100%;height:55dvh;border:0;background:white" src="'+previewURL+'"></iframe>':'<p>Aperçu indisponible pour ce type de fichier.</p>';let m=modal(f.name,content+'<p class="small muted">'+escapeHTML(f.notes||'')+'</p><div class="toolbar"><a class="btn" download="'+escapeHTML(f.name)+'" href="'+previewURL+'">Télécharger</a></div>');m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]')){if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null}},{once:true});return}
else if(action==='upload'){let input=document.createElement('input');input.type='file';input.multiple=true;input.accept='image/*,application/pdf,.txt,.doc,.docx';input.onchange=async()=>{for(const file of input.files){if(file.size>12*1024*1024){toast('Fichier supérieur à 12 Mo : non importé');continue}let data=bytesToB64(new Uint8Array(await file.arrayBuffer()));store.files.push({id:id(),name:file.name,mime:file.type||'application/octet-stream',data,folder,created:new Date().toISOString(),notes:'',tags:'',expiry:'',deletedAt:null})}await save();render();toast('Import terminé')};input.click();return}
else if(action==='template'){let choice=ask('Modèle : 1 Véhicule, 2 Logement, 3 Administratif','1'),templates={'1':['Carte grise','Assurance','Entretien','Factures','Contrôle technique'],'2':['Assurance','Factures','Contrats','Travaux'],'3':['Identité','Impôts','Santé','Banque']};if(!templates[choice])return;let n=ask('Nom du dossier principal');if(!n?.trim())return;let parent=id();store.folders.push({id:parent,name:n.trim(),parent:folder});templates[choice].forEach(name=>store.folders.push({id:id(),name,parent}))}
else if(action==='subscription-add'||action==='subscription-edit'){let f=action.endsWith('edit')?store.subscriptions.find(x=>x.id===identifier):null;let e=modal(f?'Modifier l’abonnement':'Nouvel abonnement','<form id="subform">'+input('Nom','name',f?.name||'')+input('Prix (€)','price',f?.price||'0','number')+'<label>Fréquence</label><select class="field" name="frequency">'+[['monthly','Mensuelle'],['quarterly','Trimestrielle'],['yearly','Annuelle']].map(z=>'<option value="'+z[0]+'" '+(f?.frequency===z[0]?'selected':'')+'>'+z[1]+'</option>').join('')+'</select>'+input('Prochaine échéance','next',f?.next||today(),'date')+input('Rappels (jours, séparés par virgule)','alerts',f?.alerts||'30,7')+'<button class="btn">Enregistrer</button></form>');e.querySelector('form').onsubmit=async ev=>{ev.preventDefault();let fd=new FormData(ev.target),v=Object.fromEntries(fd.entries());if(!f)store.subscriptions.push({id:id(),...v,history:[]});else Object.assign(f,v);await save();e.remove();render();toast('Abonnement enregistré')};return}
else if(action==='renew'){let f=store.subscriptions.find(x=>x.id===identifier);if(!confirm('Confirmer le renouvellement de '+f.name+' ?'))return;f.history??=[];f.history.push(f.next);let d=new Date(f.next+'T12:00:00');let months={monthly:1,quarterly:3,yearly:12}[f.frequency]||1;let originalDay=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(originalDay,last));f.next=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
else if(action==='subscription-delete'){if(confirm('Supprimer cet abonnement ?'))store.subscriptions=store.subscriptions.filter(x=>x.id!==identifier)}
else if(action==='trash'){let trashed=store.files.filter(x=>x.deletedAt);let e=modal('Corbeille — 30 jours',trashed.length?trashed.map(x=>row('▤',x.name,'Supprimé le '+datefmt(x.deletedAt),act('Restaurer','recover',x.id)+act('Définitif','purge',x.id,'warn'))).join(''):'<p>Corbeille vide.</p>');e.addEventListener('click',async ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let f=store.files.find(x=>x.id===b.dataset.id);if(b.dataset.action==='recover')f.deletedAt=null;if(b.dataset.action==='purge'&&confirm('Supprimer définitivement ?'))store.files=store.files.filter(x=>x.id!==b.dataset.id);await save();e.remove();render();change('trash')});return}
else if(action==='backup'){let text=JSON.stringify({format:'priveo-backup',version:1,vault:secret}),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Priveo-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sauvegarde créée : conserve-la hors du téléphone');return}
else if(action==='restore'){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{let v=JSON.parse(await input.files[0].text());if(v.format!=='priveo-backup'||!v.vault?.salt||!v.vault?.box)throw Error();if(!confirm('Remplacer le coffre local actuel par cette sauvegarde ?'))return;await setVault(v.vault);secret=v.vault;lock();toast('Sauvegarde restaurée : déverrouille avec son mot de passe')}catch(e){toast('Archive non valide')}};input.click();return}
else return;
await save();render()}
document.addEventListener('submit',async ev=>{if(ev.target.id==='authform'){ev.preventDefault();let password=new FormData(ev.target).get('password');if(!secret&&password.length<12){toast('Choisis au moins 12 caractères');return}await auth(password)}});
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action],[data-tab]');if(!b)return;lastInput=Date.now();if(b.dataset.tab)navigate(b.dataset.tab);else change(b.dataset.action,b.dataset.id).catch(e=>{console.error(e);toast('Une erreur est survenue')})});
document.addEventListener('input',ev=>{lastInput=Date.now();if(ev.target.id==='search'){filter=ev.target.value;let start=ev.target.selectionStart;render();let el=$('#search');el?.focus();el?.setSelectionRange(start,start)}});
document.addEventListener('change',ev=>{if(ev.target.id==='lockdelay'){store.settings.lockAfter=Number(ev.target.value);lockAfter=store.settings.lockAfter;save()}});
document.addEventListener('pointerdown',()=>{lastInput=Date.now()},{passive:true});document.addEventListener('keydown',()=>{lastInput=Date.now()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&key&&(!lockAfter||Date.now()-lastInput>lockAfter*60000))lock()});
setInterval(()=>{if(key&&lockAfter>0&&Date.now()-lastInput>lockAfter*60000)lock()},15000);
